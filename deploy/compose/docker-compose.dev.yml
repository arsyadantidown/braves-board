networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge
  observability_net:
    driver: bridge

services:
  frontend:
    build:
      context: ../../
      dockerfile: deploy/docker/frontend.dev.Dockerfile
    container_name: braves_board_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ../../src/frontend:/app
      - /app/node_modules
    networks:
      - frontend_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    build:
      context: ../../
      dockerfile: deploy/docker/nginx.Dockerfile
    container_name: braves_board_nginx_dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api:
    build:
      context: ../../
      dockerfile: deploy/docker/backend.dev.Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: braves_board_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ../../src/backend:/app
    env_file:
      - ../../src/backend/app/config/env/development.env
    networks:
      - frontend_net
      - backend_net
      - db_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  migrator:
    build:
      context: ../../
      dockerfile: deploy/docker/backend.dev.Dockerfile
    container_name: braves_board_migrator_dev
    command: ["sh", "/usr/src/app/deploy/docker/entrypoints/migrator.sh"]
    volumes:
      - ../../:/usr/src/app
    env_file:
      - ../../src/backend/app/config/env/development.env
    networks:
      - db_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15.6
    container_name: braves_board_db_dev
    env_file:
      - ../../src/backend/app/config/env/development.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - db_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7.2
    container_name: braves_board_redis_dev
    env_file:
      - ../../src/backend/app/config/env/development.env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - db_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redisinsight:
    image: redis/redisinsight:3.4
    container_name: braves_board_redisinsight_dev
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data_dev:/data
    networks:
      - db_net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: braves_board_pgadmin_dev
    env_file:
      - ../../src/backend/app/config/env/development.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    networks:
      - db_net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: braves_board_prometheus_dev
    volumes:
      - ../../src/backend/app/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_dev:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability_net
      - backend_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: braves_board_grafana_dev
    env_file:
      - ../../src/backend/app/config/env/development.env
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data_dev:/var/lib/grafana
    networks:
      - observability_net
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data_dev:
  pgadmin_data_dev:
  redis_data_dev:
  redisinsight_data_dev:
  prometheus_data_dev:
  grafana_data_dev: