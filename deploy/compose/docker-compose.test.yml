services:
  api:
    build:
      context: ../../
      dockerfile: deploy/docker/backend.test.Dockerfile
    container_name: braves_board_backend_test
    ports:
      - "8000:8000"
    volumes:
      - ../../:/usr/src/app
    env_file:
      - ../../src/backend/app/config/env/test.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: braves_board_db_test
    env_file:
      - ../../src/backend/app/config/env/test.env

    ports:
      - "5432:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: braves_board_redis_test
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redis_data_test:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_test:
  redis_data_test: