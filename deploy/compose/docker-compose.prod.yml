networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge

services:
  nginx:
    build:
      context: ../../
      dockerfile: deploy/docker/nginx.Dockerfile
    container_name: braves_board_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api:
    build:
      context: ../../
      dockerfile: deploy/docker/backend.prod.Dockerfile
    container_name: braves_board_backend_prod
    command: ["sh", "/entrypoints/api.sh"]
    env_file:
      - ../../src/backend/app/config/env/production.env
    networks:
      - backend_net
      - db_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  migrator:
    build:
      context: ../../
      dockerfile: deploy/docker/backend.prod.Dockerfile
    container_name: braves_board_migrator_prod
    command: ["sh", "/entrypoints/migrator.sh"]
    env_file:
      - ../../src/backend/app/config/env/production.env
    networks:
      - db_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: timescale/timescaledb:latest-pg15
    container_name: braves_board_db_prod
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    env_file:
      - ../../src/backend/app/config/env/production.env

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - db_net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
      image: redis:7
      container_name: braves_board_redis_prod
      command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
      volumes:
        - redis_data_prod:/data
      networks:
        - db_net
      restart: always
      healthcheck:
        test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
        interval: 10s
        timeout: 5s
        retries: 5

  # Agen Pengirim Metrik (Google Cloud Monitoring)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: braves_board_otel_prod
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../../deploy/monitoring/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Rahasia Service Account dari GCP untuk otentikasi
      - ../../src/backend/app/config/credentials/gcp-service-account.json:/etc/gcp/service-account.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/service-account.json
      - METRICS_SECRET=${METRICS_SECRET}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    networks:
      - backend_net
    depends_on:
      api:
        condition: service_healthy
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod: